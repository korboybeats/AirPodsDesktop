name: Windows Builds

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'Assets/**'
      - 'Docs/**'

  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'Assets/**'
      - 'Docs/**'

  workflow_dispatch:

env:
  PLATFORM_NAME: Win32
  BUILD_TYPE: RelWithDebInfo
  UPLOAD_ARTIFACT: true
  FIXED_CMAKE_VERSION: 3.21.4
  VCPKG_DEFAULT_TRIPLET: x86-windows

jobs:
  Build:
    runs-on: windows-latest

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare build directory
        run: mkdir Build

      - name: Cache CMake install
        id: cache-cmake
        uses: actions/cache@v4
        with:
          path: C:\Program Files\CMake
          key: cmake-${{ env.FIXED_CMAKE_VERSION }}

      - name: Use a fixed version of CMake
        if: steps.cache-cmake.outputs.cache-hit != 'true' && env.FIXED_CMAKE_VERSION != ''
        run: |
          choco install cmake.install --version ${{ env.FIXED_CMAKE_VERSION }} --installargs 'ADD_CMAKE_TO_PATH=System' --force

      - name: Print CMake version
        run: cmake --version

      - name: Cache NSIS
        id: cache-nsis
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\NSIS
          key: nsis-3

      - name: Install NSIS
        if: steps.cache-nsis.outputs.cache-hit != 'true'
        run: choco install nsis -y

      - name: Cache AirPodsDesktop-Deps
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: Build/AirPodsDesktop-Deps
          key: airpods-deps-v1

      - name: Clone dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        working-directory: Build
        run: |
          git clone --recursive https://github.com/SpriteOvO/AirPodsDesktop-Deps.git
          dir AirPodsDesktop-Deps

      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: |
            Build/vcpkg
            !Build/vcpkg/buildtrees
            !Build/vcpkg/downloads
          key: vcpkg-${{ hashFiles('vcpkg.json') }}-x86-windows-v1

      - name: Clone and bootstrap vcpkg
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        working-directory: Build
        run: |
          git clone --recursive https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.bat -disableMetrics

      - name: Bootstrap vcpkg (cached)
        if: steps.cache-vcpkg.outputs.cache-hit == 'true'
        working-directory: Build
        run: |
          if not exist vcpkg\vcpkg.exe (
            ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          )

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: |
            Build/${{ env.BUILD_TYPE }}
            !Build/${{ env.BUILD_TYPE }}/Binary
            !Build/${{ env.BUILD_TYPE }}/Installer
          key: build-${{ hashFiles('vcpkg.json', 'CMakeLists.txt', 'Source/**') }}-v1
          restore-keys: |
            build-

      - name: Generate project and build
        working-directory: Build
        run: |
          mkdir ${{ env.BUILD_TYPE }} 2>nul
          cd ${{ env.BUILD_TYPE }}

          cmake -G "Visual Studio 17 2022" ^
                -A ${{ env.PLATFORM_NAME }} ^
                -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} ^
                -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake ^
                -DCMAKE_PREFIX_PATH=${{ github.workspace }}/Build/AirPodsDesktop-Deps/Qt/5.15.2/msvc2019 ^
                -DAPD_GENERATE_INSTALLER=ON ^
                -DAPD_BUILD_GIT_HASH=${{ github.sha }} ^
                ../../

          cmake --build . ^
                --config ${{ env.BUILD_TYPE }}

          dir /s Binary
          dir /s Installer

      - name: Prepare artifacts
        if: env.UPLOAD_ARTIFACT == 'true'
        working-directory: Build\${{ env.BUILD_TYPE }}\Installer
        run: |
          cd _CPack_Packages\win32\NSIS
          move AirPodsDesktop-*-win32 AirPodsDesktop-${{ github.sha }}-win32

      - name: Upload artifact - Installer
        uses: actions/upload-artifact@v4
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          name: AirPodsDesktop-${{ github.sha }}-Installer
          path: Build\${{ env.BUILD_TYPE }}\Installer\AirPodsDesktop-*-win32.exe
          retention-days: 90

      - name: Upload artifact - Portable
        uses: actions/upload-artifact@v4
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          name: AirPodsDesktop-${{ github.sha }}-Portable
          path: Build\${{ env.BUILD_TYPE }}\Installer\_CPack_Packages\win32\NSIS\AirPodsDesktop-${{ github.sha }}-win32\AirPodsDesktop
          retention-days: 90
